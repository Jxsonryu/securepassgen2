<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free strong random password generator. Create secure passwords instantly.">
    <title>SecurePassGen - Free Strong Random Password Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1a1a1a; padding: 30px; border-radius: 16px; }
        h1 { text-align: center; }
        button { width: 100%; padding: 16px; margin: 10px 0; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; }
        .generate { background: #ff6b00; color: white; }
        .copy { background: #00cc77; color: white; }
        .passphrase { background: #ffd000; color: black; }
        .password { font-size: 26px; padding: 25px; background: #111; border-radius: 12px; text-align: center; margin: 20px 0; word-break: break-all; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 SecurePassGen</h1>
        <p style="text-align:center;">Free • Secure • Private • Works Offline</p>
        
        <div class="password" id="password">Click Generate</div>
        
        <button class="generate" onclick="generatePassword()">Generate Strong Password</button>
        <button class="copy" onclick="copyPassword()">Copy to Clipboard</button>

        <p><strong>Length:</strong> <input type="range" id="length" min="8" max="32" value="16" oninput="this.nextElementSibling.value = this.value; generatePassword()"> <output>16</output></p>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <label><input type="checkbox" id="upper" checked> Uppercase</label>
            <label><input type="checkbox" id="lower" checked> Lowercase</label>
            <label><input type="checkbox" id="numbers" checked> Numbers</label>
            <label><input type="checkbox" id="symbols" checked> Symbols</label>
        </div>

        <button class="passphrase" onclick="generatePassphrase()">Generate Secure Passphrase</button>
        <div class="password" id="passphrase" style="font-size:20px;"></div>
    </div>

    <script>
        function generatePassword() {
            const len = document.getElementById('length').value;
            let chars = '';
            if (document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (document.getElementById('numbers').checked) chars += '0123456789';
            if (document.getElementById('symbols').checked) chars += '!@#$%^&*';
            let pass = '';
            for (let i = 0; i < len; i++) pass += chars[Math.floor(Math.random() * chars.length)];
            document.getElementById('password').innerText = pass;
        }
        function copyPassword() {
            const pass = document.getElementById('password').innerText;
            if (pass !== 'Click Generate') navigator.clipboard.writeText(pass).then(() => alert('✅ Copied!'));
        }
        function generatePassphrase() {
            const words = ['apple','mountain','river','freedom','shadow','lightning','ocean','star','quantum','echo'];
            let phrase = '';
            for (let i = 0; i < 4; i++) phrase += words[Math.floor(Math.random()*words.length)] + (i<3 ? '-' : '');
            document.getElementById('passphrase').innerText = phrase;
        }
        window.onload = generatePassword;
    </script>
</body>
</html>
