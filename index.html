<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free strong random password generator. Create secure passwords instantly.">
    <meta name="google-site-verification" content="SprdVTQRI7fqLNEyHNwhYkUjLNoBAZKWjQ51gJBU9F8" />
    <title>SecurePassGen - Free Strong Random Password Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #161616;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            border: 1px solid #333;
        }
        h1 {
            text-align: center;
            font-size: 2.8rem;
            margin: 0 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .subtitle { 
            text-align: center; 
            color: #aaa; 
            margin-bottom: 30px; 
            font-size: 1.1rem;
        }

        .password {
            font-size: 29px;
            padding: 28px;
            background: #111;
            border: 2px solid #444;
            border-radius: 16px;
            text-align: center;
            margin: 25px 0;
            word-break: break-all;
            font-family: monospace;
            min-height: 80px;
        }

        .strength-meter {
            height: 12px;
            background: #222;
            border-radius: 999px;
            margin: 15px 0;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            transition: all 0.5s ease;
        }

        button {
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            font-size: 18px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .generate { background: #ff6b00; color: white; }
        .copy { background: #00cc77; color: white; }
        .passphrase { background: #ffd000; color: #111; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 SecurePassGen</h1>
        <p class="subtitle">Free • Secure • Private • Works Offline</p>
        
        <div class="password" id="password">Click Generate</div>

        <div class="strength-meter">
            <div class="strength-bar" id="strengthBar" style="background: linear-gradient(to right, #ff3b30, #ffcc00, #34c759); width: 0%;"></div>
        </div>
        <div id="strengthText" style="text-align:center; font-weight:700; margin-bottom:20px;">—</div>

        <button class="generate" onclick="generatePassword()">Generate Strong Password</button>
        <button class="copy" onclick="copyPassword()">Copy to Clipboard</button>

        <p><strong>Length:</strong> <input type="range" id="length" min="8" max="32" value="16" oninput="this.nextElementSibling.value = this.value; generatePassword()" style="width:100%"> <output>16</output></p>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin:20px 0;">
            <label><input type="checkbox" id="upper" checked onchange="generatePassword()"> Uppercase</label>
            <label><input type="checkbox" id="lower" checked onchange="generatePassword()"> Lowercase</label>
            <label><input type="checkbox" id="numbers" checked onchange="generatePassword()"> Numbers</label>
            <label><input type="checkbox" id="symbols" checked onchange="generatePassword()"> Symbols</label>
        </div>

        <button class="passphrase" onclick="generatePassphrase()">Generate Secure Passphrase</button>
        <div class="password" id="passphrase" style="font-size:21px;"></div>
    </div>

    <script>
        function updateStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            const percentage = Math.min(100, (score / 6) * 100);
            document.getElementById('strengthBar').style.width = percentage + '%';
            
            const text = document.getElementById('strengthText');
            if (score >= 5) {
                text.textContent = 'VERY STRONG';
                text.style.color = '#34c759';
            } else if (score >= 4) {
                text.textContent = 'STRONG';
                text.style.color = '#ffcc00';
            } else if (score >= 3) {
                text.textContent = 'MEDIUM';
                text.style.color = '#ff9500';
            } else {
                text.textContent = 'WEAK';
                text.style.color = '#ff3b30';
            }
        }

        function generatePassword() {
            const len = document.getElementById('length').value;
            let chars = '';
            if (document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (document.getElementById('numbers').checked) chars += '0123456789';
            if (document.getElementById('symbols').checked) chars += '!@#$%^&*()_+';
            
            let pass = '';
            for (let i = 0; i < len; i++) {
                pass += chars[Math.floor(Math.random() * chars.length)];
            }
            document.getElementById('password').innerText = pass;
            updateStrength(pass);
        }

        function copyPassword() {
            const pass = document.getElementById('password').innerText;
            if (pass !== 'Click Generate') {
                navigator.clipboard.writeText(pass).then(() => alert('✅ Copied!'));
            }
        }

        function generatePassphrase() {
            const words = ['apple','mountain','river','freedom','shadow','lightning','ocean','star','quantum','echo','brave','silent','thunder','crystal','phoenix'];
            let phrase = '';
            for (let i = 0; i < 4; i++) {
                phrase += words[Math.floor(Math.random()*words.length)] + (i < 3 ? '-' : '');
            }
            document.getElementById('passphrase').innerText = phrase;
        }

        window.onload = generatePassword;
    </script>
</body>
